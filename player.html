<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RK IP TV — Player</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

  <!-- HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="player.css">

  <!-- JS -->
  <script defer src="player.js"></script>

</head>

<body>

  <div class="player-wrap" id="playerWrap">

    <div class="video-area" id="videoArea">

      <!-- VIDEO -->
      <video id="video" playsinline webkit-playsinline>
      </video>

      <!-- DOUBLE TAP -->
      <div class="tap-zone tap-left" id="tapLeft">
      </div>

      <div class="tap-zone tap-right" id="tapRight">
      </div>

      <!-- TOP OVERLAY -->
      <div class="top-overlay" id="topOverlay">

        <button class="back-btn" onclick="history.back()">

          <i class="ti ti-arrow-left"></i>

        </button>

        <div class="channel-title" id="channelTitle">

          Live Stream

        </div>

      </div>

      <!-- CENTER CONTROLS -->
      <div class="center-controls" id="centerControls">

        <button class="center-btn" onclick="seekBackward()">

          <i class="ti ti-rewind-backward-10"></i>

        </button>

        <button class="center-play" onclick="togglePlay()">

          <i class="ti ti-player-play" id="bigIcon">
          </i>

        </button>

        <button class="center-btn" onclick="seekForward()">

          <i class="ti ti-rewind-forward-10"></i>

        </button>

      </div>

      <!-- BUFFER -->
      <div class="buffer-spinner" id="bufferSpinner">

        <i class="ti ti-loader-2 spinning">
        </i>

      </div>

      <!-- RETRY -->
      <button class="retry-btn" id="retryBtn" onclick="retryStream()">

        Retry

      </button>

      <!-- BOTTOM CONTROLS -->
      <div class="controls" id="controls">

        <!-- PROGRESS -->
        <div class="progress-wrap">

          <span id="currentTime">

            00:00

          </span>

          <input type="range" id="progressBar" value="0">

          <span id="duration">

            00:00

          </span>

        </div>

        <!-- BOTTOM BAR -->
        <div class="bottom-controls">

          <!-- LEFT -->
          <div class="left-controls">

            <button class="ctrl-btn" onclick="togglePlay()">

              <i class="ti ti-player-play" id="playIcon">
              </i>

            </button>

            <span class="live-badge">

              LIVE

            </span>

            <span class="remain-time" id="remainTime">

              --:--

            </span>

          </div>

          <!-- RIGHT -->
          <div class="right-controls">

            <div class="volume-wrap">

              <button class="ctrl-btn" onclick="toggleMute()">

                <i class="ti ti-volume" id="volumeIcon">
                </i>

              </button>

              <input type="range" min="0" max="100" value="100" id="volumeSlider">

            </div>

            <button class="ctrl-btn" onclick="toggleSettings()">

              <i class="ti ti-settings">
              </i>

            </button>

            <button class="ctrl-btn" onclick="togglePiP()">

              <i class="ti ti-picture-in-picture">
              </i>

            </button>

            <button class="ctrl-btn" onclick="toggleFullscreen()">

              <i class="ti ti-maximize" id="fullscreenIcon">
              </i>

            </button>

          </div>

        </div>

      </div>

      <!-- SETTINGS -->
      <div class="settings-popup" id="settingsPopup">

        <!-- QUALITY -->
        <div class="settings-block">

          <div class="settings-head">

            Quality

          </div>

          <div id="qualityList">

          </div>

        </div>

        <!-- SPEED -->
        <div class="settings-block">

          <div class="settings-head">

            Playback Speed

          </div>

          <div class="speed-list">

            <div class="speed-item" data-speed="0.5">

              0.5x

            </div>

            <div class="speed-item" data-speed="1">

              1x

            </div>

            <div class="speed-item" data-speed="1.5">

              1.5x

            </div>

            <div class="speed-item" data-speed="2">

              2x

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</body>

</html>
