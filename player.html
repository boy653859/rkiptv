<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RK IPTV Player</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

  <!-- HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="player.css">

  <!-- JS -->
  <script defer src="player.js"></script>

</head>

<body>

  <div class="video-area" id="videoArea">

    <!-- VIDEO -->
    <video id="video" playsinline webkit-playsinline>
    </video>

    <!-- TOP -->
    <div class="top-overlay">

      <button class="top-btn" onclick="goBack()">

        <i class="ti ti-arrow-left"></i>

      </button>

      <div class="channel-title" id="channelTitle">

        Live Stream

      </div>

    </div>


    <!-- CENTER -->
    <div class="center-controls" id="centerControls">

      <button class="center-btn" onclick="seekBackward()">

        <i class="ti ti-rewind-backward-10"></i>

      </button>

      <button class="center-play" onclick="togglePlay()">

        <i class="ti ti-player-play" id="bigIcon"></i>

      </button>

      <button class="center-btn" onclick="seekForward()">

        <i class="ti ti-rewind-forward-10"></i>

      </button>

    </div>


    <!-- BUFFER -->
    <div class="buffer-spinner" id="bufferSpinner">

      <i class="ti ti-loader-2 spinning"></i>

    </div>


    <!-- BOTTOM -->
    <div class="controls" id="controls">

      <!-- Progress -->

      <div class="progress-wrap">

        <input type="range" id="progressBar" value="0">

      </div>


      <div class="bottom-controls">

        <!-- Left -->

        <div class="left-controls">

          <button class="ctrl-btn" onclick="togglePlay()">

            <i class="ti ti-player-play" id="playIcon"></i>

          </button>

          <span id="remainTime">

            --:--

          </span>

        </div>


        <!-- Right -->

        <div class="right-controls">

          <div class="volume-wrap">

            <button class="ctrl-btn" onclick="toggleMute()">

              <i class="ti ti-volume" id="volumeIcon"></i>

            </button>

            <input type="range" id="volumeSlider" min="0" max="100" value="100">

          </div>


          <button class="ctrl-btn" onclick="toggleSettings()">

            <i class="ti ti-settings"></i>

          </button>


          <button class="ctrl-btn" id="pipBtn" onclick="togglePiP()">

            <i class="ti ti-picture-in-picture"></i>

          </button>


          <button class="ctrl-btn" onclick="toggleFullscreen()">

            <i class="ti ti-maximize" id="fullscreenIcon"></i>

          </button>

        </div>

      </div>

    </div>


    <!-- SETTINGS -->

    <div class="settings-menu" id="settingsMenu">

      <div class="settings-title">

        Quality

      </div>

      <div id="qualityList">

      </div>

    </div>


  </div>

</body>

</html>
